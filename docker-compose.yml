version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: traces-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: traces
      POSTGRES_USER: traces
      POSTGRES_PASSWORD: traces
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  redis:
    image: redis:7-alpine
    container_name: traces-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
